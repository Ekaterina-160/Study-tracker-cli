<!DOCTYPE html>
   <html>
   <head>
       <title>Аналитика</title>
   </head>
   <body>
       <h2>Аналитика оценок</h2>

       {% if not has_data %}
           <p>Пока нет данных для аналитики. Добавьте первую оценку.</p>
       {% else %}
           <p>Всего записей: {{ total_records }}</p>
           <p>Средний балл: {{ average_score }}</p>
       {% endif %}
   </body>
   </html>
